services:
  - type: web
    name: juego-del-ahorcado-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: DATABASE_PATH
        value: /tmp/hangman.db

  - type: web
    name: juego-del-ahorcado-frontend
    runtime: static
    rootDir: ahorcado-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://juego-del-ahorcado-api.onrender.com
